<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EALG seedling logo alternative</title>
  <desc id="desc">Alternative EALG logo with a geometric abstract green seedling badge.</desc>

  <defs>
    <linearGradient id="bg" x1="90" y1="20" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2F9EE"/>
      <stop offset="1" stop-color="#D8EED1"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#194E3A"/>
      <stop offset="1" stop-color="#2E7C56"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B2F08A"/>
      <stop offset="1" stop-color="#4FB86A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#285A41" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1360" height="380" rx="34" fill="url(#bg)"/>
  <rect x="20" y="20" width="1360" height="380" rx="34" stroke="#6EA57F" stroke-opacity="0.36" stroke-width="2"/>

  <path d="M70 128 C230 73, 450 87, 615 142" stroke="#7DBA8A" stroke-opacity="0.2" stroke-width="3"/>
  <path d="M80 332 C260 290, 480 297, 660 347" stroke="#6FAE80" stroke-opacity="0.2" stroke-width="3"/>

  <g transform="translate(845 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="430" height="300" rx="34" fill="url(#badge)"/>
    <rect x="0" y="0" width="430" height="300" rx="34" stroke="#CFEED6" stroke-opacity="0.35" stroke-width="2"/>

    <circle cx="212" cy="158" r="90" fill="#173E2F" fill-opacity="0.65"/>

    <path d="M212 230 C209 198, 214 169, 212 125" stroke="url(#leaf)" stroke-width="9" stroke-linecap="round"/>

    <path d="M212 177 C188 170, 160 148, 145 116 C178 116, 204 129, 221 152" fill="url(#leaf)"/>
    <path d="M212 164 C236 156, 262 135, 275 105 C242 108, 218 122, 201 144" fill="url(#leaf)"/>

    <path d="M212 202 C236 197, 257 183, 274 164" stroke="#DDF9C8" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M212 204 C189 198, 166 184, 148 166" stroke="#DDF9C8" stroke-width="2" stroke-opacity="0.6"/>

    <circle cx="212" cy="125" r="5" fill="#D8F7BB"/>
    <circle cx="154" cy="119" r="4" fill="#D8F7BB"/>
    <circle cx="267" cy="108" r="4" fill="#D8F7BB"/>

    <text x="215" y="278" fill="#EAF8EC" font-family="'Trebuchet MS', 'Gill Sans', sans-serif" font-size="16" letter-spacing="1" text-anchor="middle" textLength="368" lengthAdjust="spacingAndGlyphs">GROWTH THROUGH ALGORITHMIC THINKING</text>
  </g>

  <text x="98" y="200" fill="#163D2D" font-family="Georgia, 'Times New Roman', serif" font-size="122" font-weight="700" letter-spacing="5">EALG</text>
  <text x="100" y="250" fill="#2E6C4E" font-family="'Trebuchet MS', 'Gill Sans', sans-serif" font-size="34" letter-spacing="2.4">EFFICIENT ALGORITHMS</text>

  <g stroke="#3D8D61" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="104" y1="288" x2="464" y2="288"/>
    <line x1="104" y1="326" x2="384" y2="326"/>
  </g>

  <text x="102" y="317" fill="#3D8D61" font-family="'Trebuchet MS', 'Gill Sans', sans-serif" font-size="20" letter-spacing="1.5">DATA STRUCTURES • PROFILING • OPTIMIZATION</text>
</svg>
